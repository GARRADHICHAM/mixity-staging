{% load i18n %}

            </h3>
            <hr class="hr--sidemenu">
            <p style="background: #0baca2;filter: blur(1rem);">

                {% blocktrans trimmed %}Indisponible en version d'essai{% endblocktrans %}
            </p>
            <div style="position: absolute; bottom:42px; left:0; text-align: center; width: 100%">
                <span style="width: 82%;display: inline-block;color:white; font-weight: bold">{% blocktrans trimmed %}Indisponible en version d'essai{% endblocktrans %}</span>
            </div>
          </div>
