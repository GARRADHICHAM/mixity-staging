{% load i18n %}
{% load l10n %}
{% load static %}
{% load format_number %}


<!-- Create a div where the graph will take place -->
{% localize off %}
<div id="c_plot_container_{{id}}" style="display: flex; flex-direction: column;position:relative;">
    <div id="circular_plot_{{id}}"></div>
    {% if last_year_value and percent_inner %}
    <div style="width: 100%; display: flex; justify-content: center;top: 57%; position:absolute;">
        <div style="border-radius: 15px; border:1px solid {{ color }}; padding: {% if small %}0px 6px; font-size: 10pt{% else %}2px 10px; font-size:12pt{% endif %}">
            <span><span style="color: {{ color }};">{% points current_year=percent_inner last_year=last_year_value show_evolution=True %}</span></span>
        </div>
    </div>
    {% endif %}
</div>

{% block scripts %}
<script type="application/javascript">
    // set the dimensions and margins of the graph
    $(document).ready(function () {
        {% if small %}
            let width = 200
            let height = 250
            let margin = 18
            let thincirclesize = 5
            let fatcirclesize = 14
            let font_size = "2em"
            let font_size_legend = "1.5em"
        {% else %}
            let width = 280
            let height = 340
            let margin = 25
            let thincirclesize = 8
            let fatcirclesize = 18
            {% if is_score_category %}
            let font_size = "3em"
            {% else %}
            let font_size = "2.5em"
            {% endif %}
            let font_size_legend = "2em"
        {% endif %}
        document.querySelector("#c_plot_container_{{id}}").style.height = height.toString() + "px";

        {% if not blank_color %}
        let blank_color = "#EBEAEA";
        {% else %}
        let blank_color = "{{ blank_color }}";
        {% endif %}


        {% if not border_color  %}
        let border_color = "#fff";
        {% else %}
        let border_color = "{{ border_color }}";
        {% endif %}

        // The radius of the pieplot is half the width or half the height (smallest one). I subtract a bit of margin.
        var radius_outter = Math.min(width, height) / 2 - margin
        var radius = radius_outter - thincirclesize
        var radius_inner = radius - fatcirclesize;

        // append the svg object to the div called 'my_dataviz'
        var svg = d3.select("#circular_plot_{{id}}")
            .append("svg")
            .attr("width", width)
            .attr("height", height)
            .append("g")
            .attr("transform", "translate(" + (width+thincirclesize) / 2 + "," + height / 2 + ")");

        // Create data
        var percent = Number("{{percent}}".replace(',', '.'));
        var percent_outter = Number("{{percent_outter}}".replace(',', '.'));
        var percent_inner = Number("{{percent_inner}}".replace(',', '.'));

        let to_8 = Math.max(8 - Math.min(percent_inner, percent_outter), 0);

        {% if round %}
            percent =  Math.ceil(percent)
            percent_outter =  Math.ceil(percent_outter)
            percent_inner =  Math.ceil(percent_inner)
        {% endif %}

        if ("{{percent}}" === "") {
            var data = {a: 100 - to_8, b: to_8}
        }
        else {
            var data = {a: 100 - percent - to_8, b:  percent + to_8}
        }

        var data_outter = {a: 100 - percent_outter - to_8, b:  percent_outter + to_8}
        var data_inner = {a: 100 - percent_inner  - to_8, b:  percent_inner + to_8}

        // Set the color scale
        var color = d3.scaleOrdinal()
            .domain(data)
            .range([blank_color, "#863C63" ,])

        var color_outter = d3.scaleOrdinal()
            .domain(data_outter)
            .range([blank_color, "#95B9C1" ,])

        var color_inner = d3.scaleOrdinal()
            .domain(data_inner)
        {% if rainbow %}
            .range([blank_color, "url(#gradient)" ,])
        {% else %}
            .range([blank_color, "{{color}}" ,])
        {% endif %}


        // Compute the position of each group on the pie:
        var pie = d3.pie()
            .value(function (d) {
                return d.value;
            })
            .sort(null)
        var data_ready = pie(d3.entries(data))
        var data_ready_outter = pie(d3.entries(data_outter))
        var data_ready_inner = pie(d3.entries(data_inner))

        // Build the pie chart: Basically, each part of the pie is a path that we build using the arc function.


        {% if display_mean_score %}
            svg.selectAll('whatever')
                .data(data_ready)
                .enter()
                .append('path')
                .attr('d', d3.arc()
                    .innerRadius(radius_inner)
                    .outerRadius(radius_outter)
                )
                .attr('fill', function (d) {
                    return (color(d.data.key))
                })
                .attr("stroke", "none")

            svg.selectAll('whatever')
                .data(data_ready_outter)
                .enter()
                .append('path')
                .attr('d', d3.arc()
                    .innerRadius(radius)
                    .outerRadius(radius_outter + 1)
                )
                .attr('fill', function (d) {
                    return (color_outter(d.data.key))
                })
                .attr("id", function(d,i) { return "outterArc_{{id}}"+i; })
                .attr("stroke", "none")
        {% endif %}


        var inner_arc = d3.arc()
                .innerRadius(radius_inner - thincirclesize)
                .outerRadius(radius_outter - thincirclesize*2)

        svg.append("defs")
            .append('pattern')
            .attr('id', 'gradient')
            .attr('width', width)
            .attr('height', width)
            .append('svg:image')
            .attr('xlink:href', '{%  static 'img/gradient.png' %}')
            .attr("width", width)
            .attr("height", width)
            .attr("x", 0)
            .attr("y", 0);


        svg.selectAll('whatever')
            .data(data_ready_inner)
            .enter()
            .append('path')
            .attr('d', inner_arc)
            .attr('fill', function (d) {
                return (color_inner(d.data.key))
            })
            .attr("id", function(d,i) { return "innerArc_{{id}}"+i; })
            .attr("stroke", "none");


        /* Borders */

        {% if display_mean_score %}
            svg.selectAll('whatever')
                .data(data_ready)
                .enter()
                .append('path')
                .attr('d', d3.arc()
                    .innerRadius(radius_outter - thincirclesize*2)
                    .outerRadius(radius_outter - thincirclesize*2 - 1)
                )
                .attr('fill', border_color)
                .attr("stroke", "none")

            svg.selectAll('whatever')
                .data(data_ready)
                .enter()
                .append('path')
                .attr('d', d3.arc()
                    .innerRadius(radius_outter - thincirclesize)
                    .outerRadius(radius_outter - thincirclesize + 1)
                )
                .attr('fill', border_color)
                .attr("stroke", "none")
        {% endif %}


        svg.append("text")
            .attr("text-anchor", "middle")
            .attr("dy", "0.35em")
            .text("{% percentage value=percent_inner %}")
            .style('font-size', font_size)
            .style('font-family', 'Cousine')
            .style('font-weight', 'normal')
            .style('fill', '{{ color }}');

        {% if display_mean_score %}
            svg.append("text")
                .attr("text-anchor", "middle")
                .attr("dy", "5em")
                .attr("dx", "-2.2em")
                .text("● {% percentage value=percent_outter %}")
                .style('font-size', font_size_legend)
                .style('font-family', 'Cousine')
                .style('font-weight', 'normal')
                .style('fill', "#95B9C1");

            svg.append("text")
                .attr("text-anchor", "middle")
                .attr("dy", "5em")
                .attr("dx", "+2.2em")
                .text("● {% percentage value=percent %}")
                .style('font-size', font_size_legend)
                .style('font-family', 'Cousine')
                .style('font-weight', 'normal')
                .style('fill', "#863C63");
        {% endif %}
    })

</script>
{% endblock %}
{% endlocalize %}
