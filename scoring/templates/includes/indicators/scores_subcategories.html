{% load format_number %}
{% load i18n %}


<div style="display:flex; flex-direction: column; width: 100%;">
    <div style="display: grid; grid-template-columns: auto 138px;">
        <div style="width: 100%">
            <h2 style="font-weight:600;margin-bottom: 2px">{% trans param.0 %}</h2>
            <div style="width: 100%; background-color: lightgray; height:12px;"></div>
            <div class="{{ category }}_bg" style="width: {{ param.1|floatformat:'0' }}%; height:12px;margin-top:-12px"></div>
        </div>
        <div style="display: flex; align-items: flex-end; justify-content: center">
            <div class="{{ category }}_right" style="background-color: white; padding:1px 12px; border-radius: 22px;color: white;font-size: 20pt;font-family: Cousine;font-weight: bold;">
            <span>{{ param.1|floatformat:'0' }}/100</span>
            </div>
        </div>
    </div>

    {% for theme in param.2 %}
    <div style="display: grid; grid-template-columns: auto 138px;">
        <div xstyle="width: 100%">
            <h3 style="margin-bottom: 2px;margin-top:8px;">{% trans theme.0 %}</h3>
            <div class="{{ category }}_bg2" style="width: {{ theme.1|floatformat:'0' }}%; height:12px;"></div>
        </div>
        <div style="display: flex; align-items: end; justify-content: center;position: relative;">
            <div class="{{category}}_subscore" style=";font-size: 20pt;font-family: Cousine;font-weight: bold;position: absolute;bottom: -9px;">
            <span>{{ theme.1|floatformat:'0' }}/{{ theme.2|floatformat:'0' }}</span>
        </div>
        </div>
     </div>
    {% endfor %}
</div>
