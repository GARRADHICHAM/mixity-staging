{% load l10n %}
{% load static %}
{% load i18n %}

<div style="display:flex; flex-direction: column; width: 100%;">
    {% for value in values %}
        <div style="display: grid; grid-template-columns: auto 100px;">
            <div xstyle="width: 100%">
                <h3 style="margin-bottom: 2px;margin-top:8px;">{% trans value.SubCategory %}</h3>
                <div class="{{ category }}_bg2" style="width: {{ value.Value|floatformat:'0' }}%; height:12px;"></div>
            </div>
            <div style="display: flex; align-items: end; justify-content: center;position: relative;">
                <div class="{{ category }}_subscore" style=";font-size: 20pt;font-family: Cousine;font-weight: bold;position: absolute;bottom: -9px;">
                    <span>{{ value.Value|floatformat:'0' }}</span>
                </div>
            </div>
        </div>
    {% endfor %}
</div>
