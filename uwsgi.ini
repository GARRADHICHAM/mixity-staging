[uwsgi]
http-socket = :$(PORT)
; when the app receives the TERM signal let's destroy it (instead of brutal reloading)
die-on-term = true
; enable the master process
master = true
; spawn multiple processes to increase concurrency
if-env = UWSGI_PROCESSES
processes = %(_)
print = Using %(processes) processes (max)
end-if =

if-not-env = UWSGI_PROCESSES
processes = 2
print = Using %(processes) processes (guess)
end-if =

; report memory usage after each request
memory-report = true
; ?
socket = /tmp/uwsgi.sock

; Needed by newrelic: https://docs.newrelic.com/docs/agents/python-agent/hosting-mechanisms/python-agent-uwsgi
enable-threads = true
single-interpreter = true

; Django wsgi configuration
file = mixity/wsgi.py

; Prevent redirection issue on HTTPS
; http://stackoverflow.com/questions/30904262/uwsgi-implement-hsts-on-heroku
route-if = equal:${HTTP_X_FORWARDED_PROTO};http redirect-permanent:https://${HTTP_HOST}${REQUEST_URI}

; Trying to fix mem leak: http://stackoverflow.com/questions/22626115/djangouwsgi-huge-excessive-memory-usage-issue
max_request = 100
if-env = CONTENT_LENGTH_LIMIT
route-if = ishigher:${CONTENT_LENGTH};%(_) return:413 Request too large
print = Limiting requests size to %(_)
end-if =

if-not-env = CONTENT_LENGTH_LIMIT
route-if = ishigher:${CONTENT_LENGTH};21000000 return:413 Request too large
print = Default content length limit
end-if =

; Resident memory per worker. Defaults to 250. Can be set using the UWSGI_RSS env var
; The max_request rule may reload the workers although there's still memory left and is subject to DOS attacks
; since it is easy to make the workers reload continuously. Now we don't reload after a certain amount of requests
; but only when the resident set size exceeds 250 mb (There are 2 workers sharing 512mb).
if-env = UWSGI_RSS
reload-on-rss = %(_)
end-if =

if-not-env = UWSGI_RSS
reload-on-rss = 250
end-if =

print = Each process can use %(reload-on-rss) mb before reloading

; Trying to disable specific uwsgi IOError catched by Sentry
; https://github.com/getsentry/raven-python/issues/732
ignore-sigpipe = true
ignore-write-errors = true
disable-write-exception = true

; https://beenje.github.io/blog/posts/uwsgi-send_file-and-python35/
wsgi-disable-file-wrapper = true

; https://uwsgi-docs.readthedocs.io/en/latest/WSGIquickstart.html
; --stats 127.0.0.1:9191

; https://docs.galaxyproject.org/en/release_18.05/admin/scaling.html
; threads: 2

; Trying to fix invalid HTTP request size (max 4096)...skip
; https://stackoverflow.com/questions/15878176/uwsgi-invalid-request-block-size
buffer-size=32768
